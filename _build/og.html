<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Fraunces;src:url(../fonts/fraunces-latin-wght-normal.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:Fraunces;font-style:italic;src:url(../fonts/fraunces-latin-wght-italic.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:Figtree;src:url(../fonts/figtree-latin-wght-normal.woff2) format("woff2");font-weight:300 900}
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;background:#10292b;position:relative;font-family:Figtree,sans-serif;color:#fbf3e4}
.bg{position:absolute;inset:0;background-size:cover}
.sh{position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,37,39,.94) 0%,rgba(14,37,39,.82) 42%,rgba(14,37,39,.15) 100%)}
.in{position:absolute;left:72px;top:64px;bottom:60px;width:700px;display:flex;flex-direction:column}
.k{font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:22px;color:#f0b24d}
h1{font-family:Fraunces,serif;font-weight:600;font-size:72px;line-height:1.04;margin-top:26px;letter-spacing:-.01em}
h1 em{font-style:italic;color:#f0b24d;font-weight:500}
p{font-size:29px;line-height:1.35;margin-top:24px;color:#efe2c8;max-width:620px}
.f{margin-top:auto;display:flex;align-items:center;gap:16px;font-size:24px;font-weight:600;color:#efe2c8}
.f b{font-family:Fraunces,serif;font-size:30px;color:#fbf3e4}
.ai{position:absolute;right:24px;bottom:20px;font-size:15px;background:rgba(14,37,39,.7);padding:5px 10px;border-radius:5px;color:#efe2c8}
</style></head><body>
<div class="bg" id="bg"></div><div class="sh"></div>
<div class="in"><div class="k" id="k"></div><h1 id="t"></h1><p id="s"></p><div class="f"><b>leuklogic.com</b><span>Abundance for All</span></div></div>
<div class="ai">Image: AI-generated</div>
<script>
const q=new URLSearchParams(location.search);
document.getElementById('bg').style.backgroundImage='url('+q.get('bg')+')';
document.getElementById('bg').style.backgroundPosition=q.get('pos')||'center';
document.getElementById('k').textContent=q.get('k');
document.getElementById('t').innerHTML=q.get('t');
document.getElementById('s').textContent=q.get('s');
document.fonts.ready.then(()=>document.body.dataset.ready=1);
</script></body></html>
